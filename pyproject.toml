[project]
name = "maeh"
version = "0.2.1"
description = "a maestro that orchestrates agents"
requires-python = ">=3.11"
dependencies = ["textual>=0.60", "typer>=0.12", "pyyaml>=6"]

[project.scripts]
maeh = "maeh.cli.main:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maeh"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Typer requires Option()/Argument() as parameter defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
