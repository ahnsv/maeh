# Sample <home>/config.toml. Run `maeh config path` to find the active file.
# The persisted default home lives in the user config as [paths].home; see docs/config.md.

[backend]
# auto selects Herdr inside a Herdr session, otherwise tmux. Other values: herdr, tmux.
kind = "auto"
herdr_bin = "herdr"
tmux_bin = "tmux"
tmux_session = "maeh"

[layout]
include_editor = true
focus = false

[agents]
primary_cmd = "codex"
critic_cmd = "codex"
editor_cmd = "vi"

[limits]
context_switch_cap = 3
review_cap = 5

[board_cache]
intake_ttl_secs = 3600
revamp_ttl_secs = 10800

[task_capsules]
max_chars = 1800

[work_hours]
start_hour = 9
end_hour = 17
workdays = [1, 2, 3, 4, 5]
